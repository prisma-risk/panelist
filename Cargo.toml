[workspace]
resolver = "3"
members = ["crates/panelist"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/prisma-risk/panelist"
homepage = "https://github.com/prisma-risk/panelist"
documentation = "https://docs.rs/panelist"
authors = ["Sebastian Thiebaud <sebastian@prismarisk.com>"]
description = "Concise, strongly typed Grafana dashboards as Rust code"
readme = "README.md"
publish = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1
