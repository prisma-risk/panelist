# SPDX-License-Identifier: Apache-2.0
#
# The dashboards in the provisioned directory are generated by
# `scripts/demo.sh` from the examples themselves, so what Grafana serves is
# exactly what `cargo run --example <name>` prints.
apiVersion: 1

providers:
  - name: Panelist examples
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 5
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
