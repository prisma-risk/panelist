#
# The demo stack behind `make demo` and `make render-examples`.
#
# Grafana is pinned to the same release `scripts/verify-grafana.sh` verifies
# the golden dashboards against, so a screenshot in the gallery and a
# round-trip proof in the docs describe the same Grafana.
name: panelist-demo

services:
  # Serves one synthetic scrape target per port. Roles decide which metric
  # families a port exposes; see exporter.py.
  exporter:
    image: python:3.13-alpine
    command: ["python", "-u", "/app/exporter.py"]
    volumes:
      - ./exporter.py:/app/exporter.py:ro
    restart: unless-stopped

  # Feeds the Loki stream `full_dashboard`'s failure panel queries.
  logs:
    image: python:3.13-alpine
    command: ["python", "-u", "/app/logs.py"]
    volumes:
      - ./logs.py:/app/logs.py:ro
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - exporter
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Grafana renders a dashboard to PNG by asking this service to load the
  # page in a headless browser. Without it, /render returns an error telling
  # you to install the plugin.
  renderer:
    image: grafana/grafana-image-renderer:3.12.9
    environment:
      RENDERING_MODE: default
      # Grafana 13 refuses to start in production mode while the renderer
      # token is still the built-in default, so both sides need a real one.
      # This value is a fixed local-only secret: the renderer is reachable
      # only from this compose network and is never published.
      AUTH_TOKEN: panelist-demo-renderer-token
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - "3000:3000"
    environment:
      # Anonymous admin keeps the demo a single click and lets the render
      # script skip credential handling. This stack is local-only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      # The callback URL is how the renderer reaches Grafana back, so it has
      # to be the in-network address, not localhost.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: panelist-demo-renderer-token
      GF_LOG_FILTERS: rendering:info
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - renderer
    restart: unless-stopped
