# release-plz configuration: https://release-plz.ieni.dev/docs
#
# Dispatch the release-plz workflow with `release-pr` to prepare a release.
# After merging that PR, dispatch it again with `release` to publish the crate,
# create a signed tag, and create a GitHub Release.

[workspace]
# Keep dependency updates in dedicated pull requests.
dependencies_update = false

# Publish a GitHub Release and tag for every crates.io release.
git_release_enable = true
git_tag_enable = true

# Maintain the crate changelog from conventional commits.
changelog_update = true

# Verify the packaged crate before uploading it.
publish_no_verify = false

# Enable this after cargo-semver-checks is part of the release environment.
semver_check = false

# Release only for user-visible changes. Other commits remain eligible for the
# changelog when a release-worthy commit is present.
release_commits = "^(feat|fix|perf|refactor)"

# `panelist` and `panelist-macros` release in lockstep: both inherit the
# workspace version, and `panelist` pins `panelist-macros` with an exact `=`
# requirement, so a release of one without the other cannot resolve.
[[package]]
name = "panelist"
version_group = "panelist"
# Keep the single-crate tag and release names. With two public packages the
# default would become `panelist-v{{ version }}`.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# Macro changes are user-facing `panelist` changes.
changelog_include = ["panelist-macros"]

[[package]]
name = "panelist-macros"
version_group = "panelist"
# Released under the `panelist` tag, GitHub Release, and changelog.
git_tag_enable = false
git_release_enable = false
changelog_update = false
changelog_include = ["panelist"]
