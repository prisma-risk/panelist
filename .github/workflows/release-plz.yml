name: Release
run-name: Release ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source commit on main
        required: true
        type: string
      request_id:
        description: Immutable release request identifier
        required: true
        type: string
      requested_version:
        description: Selected stable version without a v prefix
        required: true
        type: string
      release_notes:
        description: Public release notes
        required: true
        type: string
      origin:
        description: Release request origin
        required: true
        type: string
      skip_release_validation:
        description: Use existing source validation; always verify the crate archive
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-crate-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == vars.RELEASE_DISPATCH_ACTOR }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      REQUESTED_VERSION: ${{ inputs.requested_version }}
      SKIP_RELEASE_VALIDATION: ${{ inputs.skip_release_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select reviewed source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA" || exit 1
          git -c core.hooksPath=/dev/null checkout --detach "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.1
      - name: Install package policy checker
        if: ${{ !inputs.skip_release_validation }}
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_release*.py'
      - name: Prepare and verify crate
        run: python3 scripts/release_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: target/release-bundle/
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == vars.RELEASE_DISPATCH_ACTOR }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      REQUEST_ID: ${{ inputs.request_id }}
      REQUESTED_VERSION: ${{ inputs.requested_version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      ORIGIN: ${{ inputs.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select reviewed source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA" || exit 1
          git -c core.hooksPath=/dev/null checkout --detach "$SOURCE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: target/release-bundle/
      - name: Validate release bundle before credentials
        run: python3 scripts/release_publish.py --check
      - name: Install gitsign
        env:
          GITSIGN_VERSION: v0.16.0
          GITSIGN_SHA256: 176b77ae1cf57ac73343c378e2f1338346930324bfb20408b600d97d21e45aa1
        run: |
          curl --fail --silent --show-error --location "https://github.com/sigstore/gitsign/releases/download/${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION#v}_linux_amd64" -o "$RUNNER_TEMP/gitsign"
          echo "$GITSIGN_SHA256  $RUNNER_TEMP/gitsign" | sha256sum --check
          chmod +x "$RUNNER_TEMP/gitsign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.PUBLIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.PUBLIC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish verified crate and signed release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITSIGN_NONINTERACTIVE: '1'
        run: python3 scripts/release_publish.py
