# Cargo 1.100 does not select a registry version that was published less than this age ago,
# unless Cargo.lock already has it. This gives the community time to find a compromised release
# before `cargo update` puts it in Cargo.lock. The check uses the `pubtime` field of the registry
# index. crates.io sets it.
#
# To take an urgent security fix that was published less than this age ago, update only that crate:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>
# The override also lets in new transitive dependencies of that crate, so read the Cargo.lock diff.
[registry]
global-min-publish-age = "7 days"
